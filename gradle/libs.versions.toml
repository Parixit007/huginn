[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
# detekt 2.0 is still alpha; it is the first line that runs on Java 25 (owner decision 2026-10-07). Move to 2.0 stable when released.
detekt = "2.0.0-alpha.6"
# detekt embeds this Kotlin version and must keep it (see root build.gradle.kts).
detektKotlin = "2.4.10"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
tink = "1.23.0"
junit = "6.1.3"
jazzer = "0.30.0"
room = "2.8.5"
ksp = "2.3.12"
sqlcipher = "4.19.1"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
# Compose's test kit pulls Espresso 3.5.0, which calls a hidden Android method removed in Android 17 (D91).
espresso = "3.7.0"
junit4 = "4.13.2"
navigation = "2.10.2"
lifecycle = "2.11.0"
camerax = "1.6.2"
zxing = "3.5.4"
emojiPicker = "1.7.0"
coroutines = "1.11.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
tink = { module = "com.google.crypto.tink:tink", version.ref = "tink" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
emoji-picker = { module = "androidx.emoji2:emoji2-emojipicker", version.ref = "emojiPicker" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
